<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IFC Chapter Drill</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20261015d">
</head>
<body>
<header class="top"><div class="topin">
  <a class="brand" id="bt" href="index.html">IFC</a>
  <nav class="jump" id="nav"></nav>
</div></header>
<div class="wrap">
  <div class="hero" id="hero"></div>
  <div id="body"></div>
  <footer id="foot"></footer>
</div>
<script src="data/manifest.js?v=20261015d"></script>
<script src="assets/app.js?v=20261015d"></script>
<script>
(function(){
  var n = parseInt(new URLSearchParams(location.search).get('ch') || '1', 10);
  var s = document.createElement('script');
  s.src = 'data/ch' + n + '.js?v=' + (window.IFC_V || '');
  s.onload = function(){
    var ch = (window.IFC||{})[n];
    if (ch) { window.IFCRender(ch); }
    else { document.getElementById('hero').innerHTML = '<h1>Chapter ' + n + ' not built yet</h1><p class="lede"><a href="index.html">Back to chapters</a></p>'; }
  };
  s.onerror = function(){
    document.getElementById('hero').innerHTML = '<h1>Chapter ' + n + ' not built yet</h1><p class="lede"><a href="index.html">Back to chapters</a></p>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
